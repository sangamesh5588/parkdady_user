version: '3.8'

services:
  chat-service:
    build: .
    container_name: parking-chat-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - BASE_URL=${BASE_URL:-http://localhost:8000}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ENVIRONMENT=production
    volumes:
      - ./logs:/app/logs
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - chat-network

  redis:
    image: redis:7-alpine
    container_name: parking-chat-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - chat-network

volumes:
  redis-data:

networks:
  chat-network:
    driver: bridge
